name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Both jobs run on Windows: the app is Windows-only, and requirements.lock
# carries win32-marked pins that a Linux runner would silently drop from
# both the install and the audit.
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install pinned dependencies and test tools
        run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - name: Run the test suite
        run: python -m pytest tests -q -n auto

  dependency-audit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      # --no-deps: the lock already IS the full closure; audit exactly the pins.
      - name: Audit the pinned dependency set for known vulnerabilities
        run: python -m pip_audit -r requirements.lock --no-deps
